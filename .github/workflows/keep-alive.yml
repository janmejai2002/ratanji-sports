name: Keep Render Alive

on:
  schedule:
    # Run every 10 minutes (Render free tier spins down after 15 min of inactivity)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  keep-alive:
    name: Ping Health Endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send Warmup Heartbeat
        run: |
          echo "Sending keep-alive ping to Ratanjee Sports on Render..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 45 https://ratanjee-sports.onrender.com/api/health || echo "000")
          echo "Render HTTP Response: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Successfully kept Render instance warm!"
          else
            echo "Instance may be cold booting or waking up (HTTP $HTTP_STATUS)"
          fi
